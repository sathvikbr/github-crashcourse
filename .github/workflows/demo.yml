name: Deploy website
on:
  push:
    branches:
      - main
      - gha-data
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          key: dep-node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm 
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs: 
      script-file: ${{ steps.publish.outputs.step-output-variable }}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          key: dep-node-modules-${{ hashFiles('**/package-lock.json') }}
          path: ~/.npm 
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Publish js file name
        id: publish
        run: find dist/assets/*.js -type f -execdir echo 'step-output-variable={}' >> $GITHUB_OUTPUT ';'
      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-files
      - name: Output file contents
        run: echo "${{ needs.build.outputs.script-file }}"
      - name: Output artifacts available
        run: ls
      - name: Deploy
        run: echo "Deploying..."
